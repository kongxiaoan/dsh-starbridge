name: Verify source integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'
      - run: npm run prepare:dsh
      - run: npm run build
      - run: npm test
      - run: npm run check:docs
      - run: git diff --exit-code
